<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Music Visualizer - Interactive Prototype</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            touch-action: none;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #canvasContainer {
            position: relative;
            flex: 1;
            background: #ffffff;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }

        #controls {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
        }

        .color-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 5px;
        }

        .color-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .color-btn.active {
            border-color: #333;
            border-width: 4px;
            transform: scale(1.15);
        }

        #clearBtn {
            padding: 15px 30px;
            background: #333;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #clearBtn:hover {
            background: #555;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border-radius: 20px;
            text-align: center;
            font-size: 14px;
            color: #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 100;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        #startBtn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            transition: transform 0.3s;
        }

        #startBtn:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }

        .particle {
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <button id="startBtn">🎨 Start Creating 🎵</button>

        <div id="canvasContainer">
            <div id="info">
                <strong>Paint to create music!</strong><br>
                Each color is a different instrument. Position = Pitch. Draw fast for louder sounds!
            </div>
            <canvas id="bgCanvas"></canvas>
            <canvas id="particleCanvas"></canvas>
        </div>

        <div id="controls">
            <button class="color-btn active" data-color="red" style="background: #FF3B3B;" title="Drums"></button>
            <button class="color-btn" data-color="orange" style="background: #FF8C42;" title="Bass"></button>
            <button class="color-btn" data-color="yellow" style="background: #FFD93D;" title="Piano"></button>
            <button class="color-btn" data-color="green" style="background: #6BCF7F;" title="Marimba"></button>
            <button class="color-btn" data-color="blue" style="background: #4D96FF;" title="Synth Pad"></button>
            <button class="color-btn" data-color="purple" style="background: #9D5CFF;" title="Strings"></button>
            <button id="clearBtn">Clear Canvas</button>
        </div>
    </div>

    <script>
        // Canvas setup
        const bgCanvas = document.getElementById('bgCanvas');
        const particleCanvas = document.getElementById('particleCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const particleCtx = particleCanvas.getContext('2d');

        function resizeCanvas() {
            const container = document.getElementById('canvasContainer');
            bgCanvas.width = particleCanvas.width = container.clientWidth;
            bgCanvas.height = particleCanvas.height = container.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // State
        let isDrawing = false;
        let currentColor = 'red';
        let lastX = 0;
        let lastY = 0;
        let particles = [];
        let synths = {};
        let audioStarted = false;

        // Color to RGB mapping
        const colorMap = {
            'red': '#FF3B3B',
            'orange': '#FF8C42',
            'yellow': '#FFD93D',
            'green': '#6BCF7F',
            'blue': '#4D96FF',
            'purple': '#9D5CFF'
        };

        // Initialize audio (must be called after user interaction)
        async function initAudio() {
            if (audioStarted) return;

            await Tone.start();
            console.log('Audio started');

            // Create synths for each color
            synths.red = new Tone.MembraneSynth({
                pitchDecay: 0.05,
                octaves: 4,
                oscillator: { type: 'sine' },
                envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 1.4 }
            }).toDestination();

            synths.orange = new Tone.FMSynth({
                harmonicity: 3,
                modulationIndex: 10,
                oscillator: { type: 'sine' },
                envelope: { attack: 0.01, decay: 0.01, sustain: 1, release: 0.5 }
            }).toDestination();

            synths.yellow = new Tone.Synth({
                oscillator: { type: 'triangle' },
                envelope: { attack: 0.005, decay: 0.1, sustain: 0.3, release: 1 }
            }).toDestination();

            synths.green = new Tone.Synth({
                oscillator: { type: 'sine' },
                envelope: { attack: 0.001, decay: 0.4, sustain: 0, release: 0.5 }
            }).toDestination();

            synths.blue = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: 'sine' },
                envelope: { attack: 0.5, decay: 1.5, sustain: 0.8, release: 2 }
            }).toDestination();

            synths.purple = new Tone.Synth({
                oscillator: { type: 'sawtooth' },
                envelope: { attack: 0.02, decay: 0.1, sustain: 0.5, release: 1 }
            }).toDestination();

            audioStarted = true;
        }

        // Start button
        document.getElementById('startBtn').addEventListener('click', async () => {
            await initAudio();
            document.getElementById('startBtn').style.display = 'none';
        });

        // Y position to frequency mapping
        function yToFrequency(y) {
            const minFreq = 110;   // A2
            const maxFreq = 1760;  // A6
            const ratio = 1 - (y / bgCanvas.height);
            return minFreq * Math.pow(maxFreq / minFreq, ratio);
        }

        // Calculate velocity based on stroke speed
        let lastTime = Date.now();
        function calculateVelocity(x, y) {
            const now = Date.now();
            const dt = now - lastTime;
            const dx = x - lastX;
            const dy = y - lastY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const velocity = Math.min(distance / (dt + 1) * 10, 1);
            lastTime = now;
            return velocity;
        }

        // Play sound
        function playSound(x, y, color, velocity) {
            if (!audioStarted || !synths[color]) return;

            const freq = yToFrequency(y);
            const volume = Tone.gainToDb(Math.max(0.1, velocity));

            synths[color].volume.value = volume;

            if (color === 'red') {
                synths[color].triggerAttackRelease(freq, '16n');
            } else if (color === 'blue') {
                synths[color].triggerAttackRelease(freq, '4n');
            } else {
                synths[color].triggerAttackRelease(freq, '8n');
            }

            // Spawn particles based on frequency and velocity
            spawnParticles(x, y, color, freq, velocity);
        }

        // Particle system
        function spawnParticles(x, y, color, frequency, velocity) {
            const count = Math.floor(velocity * 10 + 5);
            const baseSize = frequency > 500 ? 3 : 8; // High freq = small particles

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + velocity * 2;

                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: colorMap[color],
                    size: baseSize + Math.random() * 3,
                    life: 1.0,
                    decay: 0.01 + Math.random() * 0.02
                });
            }

            // Limit particle count
            if (particles.length > 1000) {
                particles = particles.slice(-1000);
            }
        }

        // Update and draw particles
        function updateParticles() {
            particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);

            particles = particles.filter(p => {
                // Physics
                p.vy += 0.2; // Gravity
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;

                // Bounce off bottom
                if (p.y > particleCanvas.height) {
                    p.y = particleCanvas.height;
                    p.vy *= -0.5;
                }

                // Draw
                if (p.life > 0) {
                    particleCtx.fillStyle = p.color;
                    particleCtx.globalAlpha = p.life;
                    particleCtx.beginPath();
                    particleCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    particleCtx.fill();
                }

                return p.life > 0 && p.y < particleCanvas.height + 100;
            });

            particleCtx.globalAlpha = 1;
            requestAnimationFrame(updateParticles);
        }
        updateParticles();

        // Drawing functions
        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            const rect = bgCanvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            lastX = x;
            lastY = y;
            lastTime = Date.now();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const rect = bgCanvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

            // Draw on background canvas
            bgCtx.strokeStyle = colorMap[currentColor];
            bgCtx.lineWidth = 8;
            bgCtx.lineCap = 'round';
            bgCtx.lineJoin = 'round';

            bgCtx.beginPath();
            bgCtx.moveTo(lastX, lastY);
            bgCtx.lineTo(x, y);
            bgCtx.stroke();

            // Play sound and spawn particles
            const velocity = calculateVelocity(x, y);
            playSound(x, y, currentColor, velocity);

            lastX = x;
            lastY = y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        // Event listeners
        bgCanvas.addEventListener('mousedown', startDrawing);
        bgCanvas.addEventListener('mousemove', draw);
        bgCanvas.addEventListener('mouseup', stopDrawing);
        bgCanvas.addEventListener('mouseout', stopDrawing);

        bgCanvas.addEventListener('touchstart', startDrawing);
        bgCanvas.addEventListener('touchmove', draw);
        bgCanvas.addEventListener('touchend', stopDrawing);

        // Color selection
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = btn.dataset.color;
            });
        });

        // Clear button
        document.getElementById('clearBtn').addEventListener('click', () => {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            particles = [];
        });

        // Hide info after 5 seconds
        setTimeout(() => {
            const info = document.getElementById('info');
            info.style.transition = 'opacity 0.5s';
            info.style.opacity = '0';
            setTimeout(() => info.remove(), 500);
        }, 5000);
    </script>
</body>
</html>
